  <main>
    <section class="judul-halaman">
      <h1>Kontak</h1>
    </section>

    <div class="kontak-grid">
      <article class="info-kontak">
        <h2>Hubungi saya</h2>
        <address>
          <p>GANTI: Pangkal Pinang</p>
          <p>Email: <a href="nurhabibah69882@gmail.com">nurhabibah69882@gmail.com</a></p>

        </ul>
      </article>

      <section class="form-kontak">
        <h2>Kirim pesan</h2>
        <form action="#" method="post">
          <label for="nama">Nama</label>
          <input type="text" id="nama" name="nama" placeholder="Nama lengkap" required>

          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="nama@email.com" required>

          <label for="hp">Nomor HP</label>
          <input type="tel" id="hp" name="hp" placeholder="081234567890" pattern="[0-9]{10,13}" title="Isi 10 sampai 13 digit angka" required>

          <label for="keperluan">Keperluan</label>
          <select id="keperluan" name="keperluan" required>
            <option value="">Pilih keperluan</option>
            <option value="kerja-sama">Kerja sama atau lowongan</option>
            <option value="pertanyaan">Pertanyaan</option>
            <option value="saran">Saran untuk website</option>
          </select>

          <label for="pesan">Pesan</label>
          <textarea id="pesan" name="pesan" rows="5" minlength="10" maxlength="500" placeholder="Tulis pesanmu (10 sampai 500 karakter)" required></textarea>

          <button class="tombol-form" type="submit">Kirim pesan</button>
          <p id="pesan-sukses" class="sukses" role="status" hidden></p>
        </form>
      </section>
    </div>

    <section class="peta">
